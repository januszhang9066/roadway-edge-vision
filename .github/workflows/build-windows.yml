name: Build Windows x64

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: aoi.exe (x86_64 Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify PE headers
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\aoi.exe"
          if (-not (Test-Path $exe)) { throw "exe not found" }
          $size = (Get-Item $exe).Length
          Write-Host "aoi.exe size: $size bytes"
          # 确认是 PE32+ x64,且开启了 ASLR + DEP
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "not an MZ executable" }
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $peOff) -ne 0x4550) { throw "not a PE image" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          if ($machine -ne 0x8664) { throw "not x86-64 (got 0x$($machine.ToString('X')))" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOff + 24 + 68)
          $chars = [BitConverter]::ToUInt16($bytes, $peOff + 22)
          Write-Host "machine=0x$($machine.ToString('X')) subsystem=$subsystem characteristics=0x$($chars.ToString('X'))"
          if (($chars -band 0x40) -eq 0) { Write-Warning "DYNAMIC_BASE (ASLR) not set" }
          if (($chars -band 0x100) -eq 0) { Write-Warning "NX_COMPAT (DEP) not set" }
          # 确认 onnxruntime 是动态加载(不应出现在导入表里)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "OK: PE32+ x64 console executable verified"

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist\aoi-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\aoi.exe" $dir
          # 附上部署脚本与配置(不含模型/凭证)
          if (Test-Path "deploy") { Copy-Item "deploy\*" $dir -Recurse -Force }
          # 生成校验和
          $hash = (Get-FileHash "$dir\aoi.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  aoi.exe" | Out-File "$dir\aoi.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoi-windows-x64
          path: dist/aoi-windows-x64/
          retention-days: 90

      - name: Create release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aoi-windows-x64/*
          generate_release_notes: true

  build-linux:
    name: aoi (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist/aoi-linux-x64
          cp target/x86_64-unknown-linux-gnu/release/aoi dist/aoi-linux-x64/
          sha256sum dist/aoi-linux-x64/aoi > dist/aoi-linux-x64/aoi.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoi-linux-x64
          path: dist/aoi-linux-x64/
          retention-days: 90
