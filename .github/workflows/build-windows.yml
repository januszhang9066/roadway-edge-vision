name: Build Windows x64

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: aoi.exe (${{ matrix.name }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # dynamic CRT:exe 较小,需要客户机上有 VC++ 运行库(部署脚本会检查)
          - name: msvc
            rustflags: "-C link-arg=/DYNAMICBASE -C link-arg=/NXCOMPAT"
            artifact: aoi-windows-x64
          # static CRT:exe 自带 CRT,客户机什么都不用装 —— 工业现场最省心
          - name: msvc-static-crt
            rustflags: "-C target-feature=+crt-static -C link-arg=/DYNAMICBASE -C link-arg=/NXCOMPAT"
            artifact: aoi-windows-x64-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Verify PE headers
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\aoi.exe"
          if (-not (Test-Path $exe)) { throw "exe not found" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "not an MZ executable" }
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $peOff) -ne 0x4550) { throw "not a PE image" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
          if ($machine -ne 0x8664) { throw "not x86-64 (got 0x$($machine.ToString('X')))" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOff + 24 + 68)
          # DllCharacteristics 在 Optional Header 里,偏移 = 24 + 70(PE32+)
          # 注意:pe+22 是 COFF File Header 的 Characteristics,完全不同的字段,读错会误判
          $chars = [BitConverter]::ToUInt16($bytes, $peOff + 24 + 70)
          Write-Host "machine=0x$($machine.ToString('X')) subsystem=$subsystem characteristics=0x$($chars.ToString('X'))"
          if (($chars -band 0x40) -eq 0) { throw "DYNAMIC_BASE (ASLR) not set" }
          if (($chars -band 0x100) -eq 0) { throw "NX_COMPAT (DEP) not set" }
          Write-Host "OK: PE32+ x64 console, ASLR+DEP enabled"

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist\${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\aoi.exe" $dir
          if (Test-Path "deploy") { Copy-Item "deploy\*" $dir -Recurse -Force }
          $hash = (Get-FileHash "$dir\aoi.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  aoi.exe" | Out-File "$dir\aoi.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          retention-days: 90

      - name: Create release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}/*
          generate_release_notes: true

  build-linux:
    name: aoi (x86_64 Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist/aoi-linux-x64
          cp target/x86_64-unknown-linux-gnu/release/aoi dist/aoi-linux-x64/
          sha256sum dist/aoi-linux-x64/aoi > dist/aoi-linux-x64/aoi.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoi-linux-x64
          path: dist/aoi-linux-x64/
          retention-days: 90
